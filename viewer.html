<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="CERB 2024 Hualien Earthquake QSM-IM V8.0 | Four Modes × Three Directions Full HD original videos">
<meta name="color-scheme" content="dark">
<title>CERB 2024 花蓮地震｜QSM V8.0 三方向四模式原生影片</title>
<style>
  :root{color-scheme:dark;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC",sans-serif}
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}body{margin:0;background:#10141c;color:#f1f4f9}
  main{width:100%;max-width:1960px;margin:auto;padding:clamp(10px,1.4vw,24px)}
  h1{font-size:clamp(1.22rem,2.1vw,2rem);line-height:1.35;margin:.1rem 0 .45rem;font-weight:650}
  .summary{font-size:.92rem;line-height:1.55;color:#adbace;margin:.2rem 0 .9rem}
  nav{display:flex;gap:9px;flex-wrap:wrap;margin:10px 0 12px}
  .tab{border:1px solid #516078;color:#ebf3ff;text-decoration:none;border-radius:7px;display:inline-block;padding:10px 15px;font-size:.95rem}
  .tab[aria-current="page"],.tab:hover,.tab:focus-visible{background:#263850;border-color:#97b9e4}
  .player-shell{margin:0;border:1px solid #323d4f;border-radius:10px;overflow:hidden;background:#000}
  video{width:100%;height:auto;aspect-ratio:16/9;display:block;background:#000;object-fit:contain}
  .meta{font-variant-numeric:tabular-nums;display:flex;flex-wrap:wrap;gap:8px 18px;color:#bfcce0;font-size:.84rem;padding:12px 0}
  .meta a,.foot a{color:#a9cdff;text-underline-offset:2px}
  .foot{margin:0 0 8px;font-size:.9rem}
  .note{font-size:.78rem;line-height:1.5;color:#98a7bb}
  button{background:#25354a;color:#edf2ff;border:1px solid #60718c;padding:7px 11px;border-radius:6px;cursor:pointer}
  @media(max-width:700px){main{padding:10px}.tab{flex:1;text-align:center;padding:10px 4px}}
  body.embed{background:#000}
  body.embed main{max-width:none;padding:0}
  body.embed header,body.embed nav,body.embed .meta,body.embed .foot,body.embed .note{display:none}
  body.embed .player-shell{border:0;border-radius:0}
</style>
</head>
<body><main>
<header>
  <h1>CERB 2024 花蓮地震｜QSM-IM Published V8.0</h1>
  <p class="summary">四模式 × 三方向。以下直接播放完整 MP4 原檔，1920 × 1080 Full HD、32.8 秒，支援全螢幕與任意時間定位。</p>
</header>
<nav aria-label="選擇方向">
  <a class="tab" href="#transverse" data-direction="transverse">短向 Transverse</a>
  <a class="tab" href="#longitudinal" data-direction="longitudinal">長向 Longitudinal</a>
  <a class="tab" href="#vertical" data-direction="vertical">垂直向 Vertical</a>
</nav>
<div class="player-shell">
<video id="video" controls playsinline preload="metadata" aria-label="CERB 四模式完整演化影片">
您的瀏覽器需要支援 HTML5 H.264 MP4 播放。
</video>
</div>
<div class="meta">
  <span id="status" aria-live="polite">正在載入影片資料…</span>
  <span>原生 Full HD 1920 × 1080</span>
  <span>原始影片 32.8 秒｜10 fps</span>
  <button id="fullscreen" type="button">全螢幕</button>
</div>
<p class="foot"><a id="raw" href="videos/CERB_transverse_four_modes.mp4">另開完整 MP4</a>　｜　<a href="README.md">閱讀研究 README</a></p>
<p class="note">三方向均保留完整原始影片內容，未進行增畫素、剪輯或重新編碼。播放品質取決於來源影片、網路與裝置。</p>
</main>
<script>
'use strict';
const names={transverse:'短向 Transverse',longitudinal:'長向 Longitudinal',vertical:'垂直向 Vertical'};
const video=document.getElementById('video');
const raw=document.getElementById('raw');
const status=document.getElementById('status');
const fullscreen=document.getElementById('fullscreen');
const tabs=Array.from(document.querySelectorAll('[data-direction]'));
const embed=new URLSearchParams(location.search).get('embed')==='1';
if(embed)document.body.classList.add('embed');
let active='';
function choose(){
  const key=location.hash.slice(1);
  const target=Object.prototype.hasOwnProperty.call(names,key)?key:'transverse';
  if(target===active)return;
  const oldTime=Number.isFinite(video.currentTime)?video.currentTime:0;
  const oldPlaying=active.length>0&&!video.paused;
  active=target;
  const path='videos/CERB_'+target+'_four_modes.mp4?v=20261017_173047_8443649f';
  video.pause();video.src=path;video.load();raw.href=path;
  video.setAttribute('aria-label',names[target]+' 四模式完整演化影片');
  status.textContent=names[target]+'｜載入 1920 × 1080 原始影片';
  tabs.forEach(a=>a.setAttribute('aria-current',a.dataset.direction===target?'page':'false'));
  if(oldTime>0){video.addEventListener('loadedmetadata',()=>{
     if(Number.isFinite(video.duration))video.currentTime=Math.min(oldTime,Math.max(0,video.duration-.05));
     if(oldPlaying)video.play().catch(()=>{});
   },{once:true});}
}
video.addEventListener('loadedmetadata',()=>{
 if(Number.isFinite(video.duration))status.textContent=names[active]+'｜片長 '+video.duration.toFixed(1)+' 秒';
});
video.addEventListener('error',()=>{
 status.textContent='影片無法載入，請確認 Pages 已部署並使用下方「另開完整 MP4」';
});
fullscreen.addEventListener('click',()=>{
 if(video.requestFullscreen){video.requestFullscreen().catch(()=>{});}
 else if(video.webkitEnterFullscreen){video.webkitEnterFullscreen();}
});
window.addEventListener('hashchange',choose);
choose();
</script>
</body></html>
